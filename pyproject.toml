[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "classroom-cli"
version = "0.1.0"
description = "Google Classroom assignments and classwork in your terminal"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.9",
    "rich>=13",
    "websocket-client>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
classroom = "classroom.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["classroom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
